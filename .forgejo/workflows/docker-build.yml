name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    # renovate.json5 joins .forgejo here because it is read by renovate on
    # luka and by nothing in the image -- so a config-only change used to
    # rebuild songbot and redeploy it on 39music to produce the same binary.
    # paths-ignore skips a push only when EVERY changed file matches, so a
    # commit touching this and a source file still builds.
    #
    # Kept narrow on purpose. tools/ is NOT listed: it holds one renovate
    # helper today, and an ignore rule over a whole directory is the kind that
    # silently stops building the day somebody puts a real build tool there.
    #
    # site/ is the concert-data website, published by publish-data.yml; no
    # part of it goes into the image.
    paths-ignore:
      - '.forgejo/**'
      - 'renovate.json5'
      - 'site/**'

  workflow_call:
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: meiko
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.miku/${{ github.repository }}.git .

      # --pull=newer because the runner's image store is now shared and
      # persistent, and buildah's default is `missing`. When sdk-update calls
      # this workflow the SDK images were just built into that same store and
      # are current either way -- but a plain push to main runs this on its own,
      # and there the bases it names must come from the registry rather than
      # from whatever the store happens to be holding.
      - name: Build
        run: |
          buildah bud --pull=newer --build-arg RUN_BENCHMARKS=1 -t git.miku/${{ github.repository }}:main .
      - name: Push
        run: |
          buildah login -u ${{ github.actor }} -p ${{ secrets.PACKAGEPUSH }} git.miku
          buildah push git.miku/${{ github.repository }}:main

  deploy:
    runs-on: meiko
    needs: build_and_publish
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H 39music.wg.lan >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 core@39music.wg.lan "podman-update"
