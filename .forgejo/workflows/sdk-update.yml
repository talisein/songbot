name: Periodic SDK Update
on:
  schedule:
    - cron: '0 2 * * 1' # Runs every Monday at 2:00 AM
  workflow_dispatch:
  # The SDK carries a prebuilt D++ (see the SDK build below), which songbot's
  # meson.build uses only while its srchash matches the wrap and overlay. So
  # rebuild as soon as either changes on main, rather than letting every build
  # compile D++ from the wrap until Monday.
  push:
    branches: [ "main" ]
    paths:
      - 'subprojects/dpp.wrap'
      - 'subprojects/packagefiles/dpp/**'
      - '.forgejo/workflows/sdk-update.yml'

jobs:
  update-images:
    runs-on: meiko
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.miku/${{ github.repository }}.git .

      # --pull=newer ON BOTH BUILDS, ADDED 2026-08-04. meiko's runner now mounts
      # ONE persistent /var/lib/containers/storage across every job, and
      # buildah's default pull policy is `missing` -- so a cached fedora:44
      # would be reused for ever and this workflow, whose entire purpose is to
      # refresh the SDK and runtime bases, would refresh nothing while
      # reporting success. `dnf -y upgrade` inside hides half of it, which is
      # what makes it worth stating: the packages would move and the base layer
      # would not.
      #
      # The store's weekly prune does not rescue this. `buildah rmi --prune`
      # takes untagged images only, so a tagged fedora:44 survives every sweep.
      #
      # `newer` and not `always`: against an unchanged base, always re-copies
      # the base blob and newer does not.
      - name: Build and Push SDK and Runtime
        run: |
          # --- 1. Build the SDK (Build-time deps) ---
          #
          # The talinet CA arrives as a build-time VOLUME, not a --build-arg, so
          # it is no longer in the image's BUILD HISTORY -- `podman history`
          # greps 0 for it now. meiko's runner mounts the host trust bundle into
          # this job container and `buildah bud -v` passes it through.
          #
          # The image DOES still carry the CA, and it is worth being exact about
          # why: -v removes the INPUT, so source/anchors/ is empty in the built
          # image, but `RUN update-ca-trust` writes the extracted bundle into the
          # layer and that is committed. Measured -- stock fedora:44 has 146
          # certificates, this image has 147. Harmless (the root CA is public),
          # and it is what the --build-arg version did too, but do not describe
          # the mount as persisting nothing.
          #
          # It is mounted into source/anchors/ and extracted, NOT over the
          # extracted bundle: mounting the extracted path read-only is what the
          # job containers do, and it would make the `dnf -y upgrade` below fail
          # the whole transaction the day it touches ca-certificates.
          # See mksystem/meiko/notes/ci-trust.md.
          cat <<EOF > Containerfile.sdk
          FROM fedora:45
          RUN update-ca-trust
          RUN dnf -y upgrade && \
              dnf -y install meson g++ libcurl-devel zlib-ng-devel openssl-devel systemd-devel git cmake json-devel nodejs-npm && \
              dnf clean all

          # PREBUILT D++, so CI does not compile it on every run. The build
          # context is the checkout, and .dockerignore narrows subprojects/ to
          # the wraps and packagefiles. 'meson subprojects download' refuses
          # without a root meson.build, hence the stub; it applies the overlay.
          # --prefix=/usr because /usr/local/lib64/pkgconfig is not on Fedora's
          # pkg-config path. srchash must be the string songbot's meson.build
          # computes: the three files' sha256 hex digests, concatenated.
          #
          # The heredoc is unquoted: escape every dollar sign meant for the
          # RUN, and use no backticks, even here in a comment.
          COPY subprojects /dppsrc/subprojects
          RUN cd /dppsrc && echo "project('stub')" > meson.build && \
              meson subprojects download dpp && \
              h=\$(for f in subprojects/dpp.wrap subprojects/packagefiles/dpp/meson.build subprojects/packagefiles/dpp/meson_options.txt; do sha256sum "\$f" | cut -d' ' -f1; done | tr -d '\\n') && \
              meson setup /tmp/dppbuild subprojects/DPP-* --prefix=/usr -Dsrchash="\$h" && \
              meson install -C /tmp/dppbuild && \
              cd / && rm -rf /dppsrc /tmp/dppbuild
          EOF
          buildah bud --pull=newer -f Containerfile.sdk \
            -v /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/pki/ca-trust/source/anchors/talinet_root_ca.crt:ro \
            -t git.miku/talisein/songbot-sdk:latest .

          # Smoke-test the D++ install before pushing: a broken SDK on :latest
          # would break every CI job until the next rebuild. Each check fails
          # the step on its own; the build is not run, a missing file is enough.
          ctr=$(buildah from git.miku/talisein/songbot-sdk:latest)
          buildah run "$ctr" -- pkg-config --modversion dpp
          buildah run "$ctr" -- sh -c 'test -n "$(pkg-config --variable=srchash dpp)"'
          buildah run "$ctr" -- test -f /usr/include/dpp/dpp.cppm
          buildah run "$ctr" -- test -f /usr/lib64/libdpp.a
          buildah rm "$ctr"

          buildah login -u ${{ github.actor }} -p ${{ secrets.PACKAGEPUSH }} git.miku
          buildah push git.miku/talisein/songbot-sdk:latest

          # --- 2. Build the Runtime (Production deps) ---
          cat <<EOF > Containerfile.runtime
          FROM fedora:45
          RUN dnf -y upgrade && \
              dnf -y install libcurl zlib-ng openssl glibc-all-langpacks && \
              dnf clean all
          EOF
          buildah bud --pull=newer -f Containerfile.runtime -t git.miku/talisein/songbot-runtime:latest .
          buildah push git.miku/talisein/songbot-runtime:latest

  trigger-songbot-build:
    runs-on: meiko
    needs: update-images
    uses: ./.forgejo/workflows/docker-build.yml
    secrets: inherit
